<body>

  <div class="tall"></div>
  <section class="x2 shell" data-fill="experience"></section>
  <div class="tall"></div>

<script>
  // Fill a shell only after it has stayed on screen for 600 ms (polled, so it also works in a hidden pane).
  const seen = new Map();
  setInterval(() => {
    document.querySelectorAll('section.shell:empty').forEach(sec => {
      const r = sec.getBoundingClientRect();
      const onScreen = r.top < window.innerHeight && r.bottom > 0;
      if (!onScreen) { seen.delete(sec); return; }
      if (!seen.has(sec)) seen.set(sec, Date.now());
      if (Date.now() - seen.get(sec) >= 600 && sec.dataset.fill !== 'ad') sec.innerHTML = document.getElementById(sec.dataset.fill).innerHTML;
    });
  }, 100);
</script>
<script>window.chrome = { runtime: { onMessage: { addListener() {} } } };</script>
<script src="../../linkedin%20extention/content_script.js"></script>
</body></html>
